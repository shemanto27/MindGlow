- hosts: webservers
  become: yes

  vars:
    project_path: /home/ubuntu/MIndGlow
    website_domain: api.mindglow.tech           
    certbot_email: your-email@example.com 
    env_file_src: ../../backend/.env
    docker_compose_src: ../../docker-compose.prod.yml
    nginx_conf_src: ../../nginx/backend.conf

  tasks:
    - name: Update apt packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install dependencies
      apt:
        name:
          - docker.io
          - docker-compose-plugin
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Create project folder
      file:
        path: ""
        state: directory
        mode: "0755"

    - name: Create backend folder
      file:
        path: "/backend"
        state: directory
        mode: "0755"

    - name: Copy .env file
      copy:
        src: ""
        dest: "/backend/.env"
        mode: "0600"

    - name: Copy docker-compose.prod.yml
      copy:
        src: ""
        dest: "/docker-compose.prod.yml"
        mode: "0644"
      notify:
        - restart docker-compose

    - name: Copy Nginx config to EC2
      copy:
        src: ""
        dest: /etc/nginx/sites-available/backend
        mode: "0644"
      notify:
        - reload nginx

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/backend
        dest: /etc/nginx/sites-enabled/backend
        state: link
      notify:
        - reload nginx

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify:
        - reload nginx

    - name: Obtain SSL certificate via Certbot
      command: >
        certbot --nginx
        -d 
        --non-interactive
        --agree-tos
        -m 
      args:
        creates: /etc/letsencrypt/live//fullchain.pem

  handlers:
    - name: reload nginx
      service:
        name: nginx
        state: reloaded

    - name: restart docker-compose
      command: docker compose -f docker-compose.prod.yml up -d
      args:
        chdir: ""