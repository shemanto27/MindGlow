name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  # CHANGE THIS to your actual Docker Hub username
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/mindglow-backend
  TAG: latest

jobs:
  dockerhub:
    name: Build, Tag and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:${{ env.TAG }}
          
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: dockerhub

    steps:
      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/MindGlow
            # Pull the latest image we just pushed
            docker compose -f docker-compose.prod.yml pull
            # Restart the service
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans